# The web app on Railway. The root railway.toml is the realtime service;
# for the web service set Settings → Config-as-code path to /railway.web.toml.
# The database is only reachable at run time, so migrations run on start, not on build.

[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start -w web"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
